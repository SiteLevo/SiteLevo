  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(65deg,
    rgba(231,231,231,.27) 0%,
    rgba(218,217,223,.27) 25%,
    rgba(210,203,193,.27) 43%,
    rgba(223,174,157,.27) 100%);
}
.card{
  position:relative;z-index:1;
  width:100%;max-width:400px;
  background:#FFFFFF;border:1px solid var(--line);border-radius:10px;
  box-shadow:0 4px 26px rgba(0,0,0,.12);
  overflow:hidden;display:flex;flex-direction:column;
}
.top{padding:22px 24px 0}
.brand{display:flex;align-items:center;gap:8px}
.brand svg{display:block;flex:none}
.brand span{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:700;
  font-size:16px;letter-spacing:-.02em;color:var(--ink);line-height:1;
}
.ident{display:flex;align-items:center;gap:13px;margin-top:20px}
.portrait{
  width:54px;height:54px;flex:none;border-radius:50%;
  object-fit:cover;display:block;background:#EFEFEF;
  box-shadow:0 2px 8px rgba(0,0,0,.13);
}
h1{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:700;
  font-size:21px;line-height:1.15;letter-spacing:-.02em;color:var(--ink);
}
.role{font-size:14px;color:var(--muted);line-height:1.35;margin-top:2px}

.qrwrap{padding:20px 24px 4px;text-align:center}
.qr{
  width:100%;max-width:242px;height:auto;display:block;margin:0 auto;
  border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;
}
.hint{
  font-size:13.5px;color:var(--muted);margin-top:13px;line-height:1.45;
}
.hint b{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:700;
  color:var(--ink);
}

.details{
  margin:18px 24px 20px;padding-top:15px;border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:4px;
}
.details div{display:flex;align-items:baseline;gap:9px;font-size:15px;color:var(--ink)}
.details span{font-size:12px;color:var(--muted);min-width:74px;flex:none}

.foot{
  background:var(--navy);color:#FFFFFF;
  padding:12px 24px;font-size:12px;line-height:1.5;
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.foot span{opacity:.85}

@media (max-height:700px){
  .top{padding-top:16px}
  .ident{margin-top:14px}
  .qr{max-width:206px}
  .qrwrap{padding-top:14px}
}
</style>
