}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(65deg,
    rgba(231,231,231,.27) 0%,
    rgba(218,217,223,.27) 25%,
    rgba(210,203,193,.27) 43%,
    rgba(223,174,157,.27) 100%);
}
.card{
  position:relative;z-index:1;
  width:100%;max-width:420px;
  background:#FFFFFF;
  border:1px solid var(--line);
  border-radius:10px;
  box-shadow:0 3px 22px rgba(0,0,0,.10);
  overflow:hidden;
}
.card__in{padding:34px 28px 30px}

/* brand */
.brand{display:flex;align-items:center;gap:9px;margin-bottom:30px}
.brand svg{display:block;flex:none}
.brand span{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:700;
  font-size:19px;letter-spacing:-.02em;color:var(--ink);line-height:1;
}

/* identitet */
.ident{display:flex;align-items:center;gap:18px}
.portrait{
  width:88px;height:88px;flex:none;border-radius:50%;
  object-fit:cover;display:block;background:#EFEFEF;
  box-shadow:0 2px 10px rgba(0,0,0,.14);
}
h1{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:700;
  font-size:28px;line-height:1.1;letter-spacing:-.025em;color:var(--ink);
}
.role{font-size:15px;color:var(--muted);margin-top:5px;line-height:1.4}
.promise{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:500;
  font-size:15px;color:var(--ink);margin-top:18px;line-height:1.45;
}

/* knapper */
.actions{margin-top:24px;display:flex;flex-direction:column;gap:12px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:700;
  font-size:15px;letter-spacing:-.01em;
  min-height:50px;padding:11px 24px;border-radius:10px;
  text-decoration:none;color:var(--ink);
  transition:background-color .15s ease, transform .08s ease;
}
.btn svg{flex:none}
.btn--sage{background:var(--sage);box-shadow:0 3px 6px rgba(0,0,0,.38)}
.btn--ghost{background:#FFFFFF;border:1px solid var(--ink)}
.btn:active{transform:translateY(1px)}
@media(hover:hover){
  .btn--sage:hover{background:var(--sage-d)}
  .btn--ghost:hover{background:#F4F4F4}
}

/* kontaktlinjer */
.rows{list-style:none;margin-top:26px;border-top:1px solid var(--line)}
.rows li{border-bottom:1px solid var(--line)}
.rows a{
  display:flex;align-items:center;gap:14px;
  padding:14px 2px;text-decoration:none;color:var(--ink);font-size:16px;
}
.rows svg{flex:none;color:var(--muted)}
.rows .lbl{display:block;font-size:12px;color:var(--muted);line-height:1.3;margin-bottom:1px}
.rows .val{display:block;line-height:1.3}
@media(hover:hover){.rows a:hover .val{color:var(--muted)}}

/* footer */
.foot{
  background:var(--navy);color:#FFFFFF;
  padding:16px 28px;font-size:13px;line-height:1.5;
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.foot span{opacity:.85}
</style>
</head>
